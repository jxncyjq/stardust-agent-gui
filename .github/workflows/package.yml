name: Package

# 三平台打包此前**从没跑过**：这个仓一条 CI 都没有，`wails build` 只在一台 Windows
# 开发机上成功过。打包是交付物本身，而「它在别的平台上还能不能打出来」不该等到要发版
# 的那天才知道。
#
# 这一版是探针：先让三个平台各跑一次，把真实的缺口暴露出来（Linux 的 webkit 依赖、
# wails 版本、跨仓库的 replace 指令），再谈签名与内置 Chromium。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    name: wails build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # 这个仓自己**建不起来**：它 require 的 github.com/stardust/legion-agent 是个未发布
      # 模块，那个地址上没有仓库可拉。go.mod 里刻意不写 replace（依赖关系属于工作区，
      # 不属于模块本身），所以两个仓都要拉、摆成兄弟目录，再由下面那步建出工作区——
      # 这是打包的真实前提，不是 CI 的花招。
      - name: Check out the GUI
        uses: actions/checkout@v4
        with:
          path: legionAgentGUI
      - name: Check out the server it builds against
        uses: actions/checkout@v4
        with:
          repository: jxncyjq/stardust-agent-server
          path: legionAgent

      - uses: actions/setup-go@v5
        with:
          go-version-file: legionAgentGUI/go.mod
          cache-dependency-path: legionAgentGUI/go.sum
      # 本地开发靠 legion/go.work，那个文件不在任何一个仓里（它横跨两个仓，
      # 无处安放），所以 CI 必须自己建一份等价的。
      #
      # 必须排在 setup-go **之后**：macOS runner 镜像不预装 go（Linux/Windows 预装，
      # 所以这个顺序错只在 macOS 上炸，`go: command not found`）。
      #
      # 只 `use` 两个模块不够：GUI 的 go.mod 仍 `require ... v0.0.0`，Go 会去解析那个
      # 版本号本身，于是即便工作区里已有同名模块也会尝试联网、以 "Repository not found"
      # 失败。工作区模块的 replace 必须带版本，否则 Go 报 "replaced at all versions"。
      - name: Wire the two checkouts into a Go workspace
        shell: bash
        run: |
          go work init ./legionAgent ./legionAgentGUI
          go work edit -replace=github.com/stardust/legion-agent@v0.0.0=./legionAgent
          cat go.work

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Wails 在 Linux 上要 GTK 与 WebKit 的开发包；runner 镜像里没有。
      # 4.1 是 Ubuntu 24.04 上的包名（旧文档里的 4.0 在这里装不上）。
      - name: Install the Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install the wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      # Linux 上要显式指定 webkit2_41：wails 默认按 webkit2gtk-4.0 拼 pkg-config，
      # 而 Ubuntu 24.04 只有 4.1（探针实测：Package 'webkit2gtk-4.0' … not found，
      # 前端都编完了才在链接这一步倒下）。
      #
      # -skipmodtidy 是必需的，不是省时间：wails build 默认在生成 bindings 前跑
      # `go mod tidy`（build.go: GoModTidy: !SkipModTidy），而 **`go mod tidy` 不认
      # workspace 的 replace**——它按单模块模式解析，于是照样去拉那个不存在的仓库。
      # 本机实测同样失败。代价写在这里：只要 legion-agent 不发布，这个模块就跑不了
      # `go mod tidy`，依赖增减要手工维护 go.mod。
      - name: Build
        working-directory: legionAgentGUI
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            wails build -clean -skipmodtidy -tags webkit2_41
          else
            wails build -clean -skipmodtidy
          fi

      - name: Show what came out
        working-directory: legionAgentGUI
        shell: bash
        run: ls -la build/bin

      # 内置浏览器**不打进安装包**（每平台 150–200MB，每次发版重发一遍），改成随包
      # 带一份安装脚本。于是新的风险是：脚本装的位置与运行时找的位置**各写各的**，
      # 装了也白装——运行时找不到就静悄悄退到系统浏览器，没有任何症状。
      #
      # 所以这里端到端对一次：跑脚本装，然后让**运行时自己**报告它找没找到。
      # 「App 的可执行文件在哪个目录」三个平台不一样，而这正是要端到端验的东西：
      # macOS 上它在 .app/Contents/MacOS/ 里，给成 build/bin 会把浏览器装到 .app
      # 旁边——脚本一路成功，App 起来却找不到（CI 第一次跑就是这么错的）。
      - name: Locate the app executable directory
        id: appdir
        working-directory: legionAgentGUI
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            app=$(ls -d build/bin/*.app | head -1)
            echo "dir=$app/Contents/MacOS" >> "$GITHUB_OUTPUT"
          else
            echo "dir=build/bin" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the pinned browser next to the app
        working-directory: legionAgentGUI
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            powershell -ExecutionPolicy Bypass -File scripts/install-chromium.ps1 -AppDir '${{ steps.appdir.outputs.dir }}'
          else
            bash scripts/install-chromium.sh '${{ steps.appdir.outputs.dir }}'
          fi

      # 让**运行时自己**回答它找没找到——脚本说「装到了 X」不算数，两边各写各的路径
      # 正是这里唯一要防的事。wherechromium 与 GUI 共用同一份查找逻辑，并且从**自己
      # 可执行文件的位置**算起，所以它必须被放到与 App 同一个目录里跑。
      - name: Ask the runtime whether it can see it
        working-directory: legionAgentGUI
        shell: bash
        run: |
          go build -o '${{ steps.appdir.outputs.dir }}/wherechromium' ./cmd/wherechromium
          found=$('${{ steps.appdir.outputs.dir }}/wherechromium')
          echo "the runtime resolved: $found"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # Windows 上 chrome.exe 是 GUI 子系统程序：--version 不往控制台写、退出码
            # 也拿不到。读版本资源，不启动它。
            powershell -Command "(Get-Item '$found').VersionInfo.ProductVersion"
          else
            "$found" --version
          fi
